# npm 취약점 공지 감시(2026-10-30 · 사고 143) — lock 이 그대로여도 공지 DB 가 바뀌면 sounding-qa 의 `npm audit --audit-level=low` 가
#   상관없는 PR 을 전부 빨갛게 만든다(10/26~30 #104·#105 가 그렇게 막혔다 — 실패는 PR 이 아니라 그날 나온 공지였다).
#   그래서 공지가 뜬 날 따로 잡는다: 매일 main 에서 audit 을 돌려 걸리면 자동경보 이슈(jota 비서실 브리핑이 읽는다) · 0 이면 스스로 닫는다.
#   PR 문턱(sounding-qa)은 그대로 둔다 — 감시는 문턱을 대신하지 않고, 문턱에 닿기 전에 고칠 시간을 번다.
# 매일 05:57 KST — refresh(06:17)·jota cheuksim-watch(07:05) 앞. 고치는 법 = `docs/도구도입_판정_20261010.md` 「보안 수정판」 절(overrides · 14일 규칙 예외 조건).
name: audit-watch

on:
  schedule:
    - cron: "57 20 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["package.json", "package-lock.json", ".github/workflows/audit-watch.yml"]

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm audit(lock 그대로 · 설치 스크립트 끔)
        id: a
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          set +e
          npm audit --audit-level=low > /tmp/audit.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -40 /tmp/audit.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 자동경보 이슈(main 만 · 걸리면 열고 · 0 이면 닫는다)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.a.outputs.code }}
        run: |
          T="npm 취약점 공지 — PR 시험(sounding-qa)이 막힌다"
          gh label create 자동경보 --color B60205 --description "측심 자동 갱신 — 사람 손 필요(jota 비서실 브리핑이 읽는다)" 2>/dev/null || true
          n=$(gh issue list --state open --label 자동경보 --search "in:title \"$T\"" --json number,title --jq "map(select(.title == \"$T\")) | .[0].number" || true)
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$CODE" != "0" ]; then
            B=$(printf 'lock 은 그대로인데 새 취약점 공지가 떴다 — 이대로면 다음 PR 의 sounding-qa 가 `npm audit` 단계에서 멈춘다. refresh·배포는 audit 을 안 돌려 영향 없다.\n\n고치는 법: `package.json` `overrides` 로 고친 판에 묶는다(`docs/도구도입_판정_20261010.md` 「보안 수정판」 절 — 14일 규칙 예외 조건 셋).\n\n- 실행: %s\n\n```\n%s\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$RUN" "$(tail -30 /tmp/audit.txt)")
            if [ -n "$n" ]; then gh issue comment "$n" --body "$B"; else gh issue create --title "$T" --body "$B" --label 자동경보; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "$(printf 'npm audit 0 건으로 돌아왔다(실행 %s) — 스스로 닫는다.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$RUN")"
          fi
      - name: 브랜치 실행 결과(이슈 0 · 종료 코드로만)
        if: github.ref_name != 'main'
        run: |
          echo "브랜치 실행 — 이슈를 열지 않는다 · audit 종료 코드 ${{ steps.a.outputs.code }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.a.outputs.code }}" = "0" ]

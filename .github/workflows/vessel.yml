# 선박 입출항 월 집계(정체성 §3-3 선박 리플레이 원천) — 2015-01~ 전 항만·선종. 키는 시크릿으로만(찍지 않음 · 사고 120).
# 갱신은 Actions 예약으로(V2 · Claude 토큰 0). 결과는 그 브랜치에 커밋(claude/ 브랜치에서 수동·설정 변경 때) · main 에서는 예약 실행이 PR 로 낸다(다음 단계).
name: vessel
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/vessel.py", ".github/workflows/vessel.yml"]
permissions:
  contents: write
jobs:
  gate:
    # 사고 131 — 경로 거르개는 「이 push 가 들여온 커밋」을 보므로 main 병합 push·새 브랜치 첫 push 에도 깨어난다.
    # push 로 깨어났으면 이 브랜치의 스크립트가 main 과 실제로 다를 때만 돈다(워크플로 파일 자체는 안 센다). 예약·수동 실행은 늘 돈다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- 'tools-build/vessel.py'; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "스크립트가 main 과 같다 — 건너뜀(사고 131)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  vessel:
    needs: gate
    if: needs.gate.outputs.run == 'yes' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools-build/vessel.py --selftest
      - name: 받기(2015-01~)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools-build/vessel.py --from 201501 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋(그 브랜치에)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected/vessel-monthly.csv data/collected/vessel-monthly.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "선박 입출항 월 집계 2015-01~ — vessel 워크플로(해양수산부 · 월·항만·선종 합계)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

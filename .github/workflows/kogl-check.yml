# 출처 대장 「공공누리 유형 미확인」 원천을 공식 제공 화면에서 확인(2026-10-14 채팅 검수 · #49 ②-3).
# 클라우드 세션은 공공데이터포털·해양수산부 화면이 막혀 Actions 에서 읽는다. 키 없음 · 공개 화면만 · 결과는 그 브랜치에 커밋.
name: kogl-check
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/kogl_check.py", ".github/workflows/kogl-check.yml"]
permissions:
  contents: write
jobs:
  gate:
    # 사고 131 — 경로 거르개는 「이 push 가 들여온 커밋」을 보므로 main 병합 push·새 브랜치 첫 push 에도 깨어난다.
    # push 로 깨어났으면 이 브랜치의 스크립트가 main 과 실제로 다를 때만 돈다(워크플로 파일 자체는 안 센다). 예약·수동 실행은 늘 돈다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- 'tools-build/kogl_check.py'; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "스크립트가 main 과 같다 — 건너뜀(사고 131)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  kogl:
    needs: gate
    if: needs.gate.outputs.run == 'yes' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools-build/kogl_check.py --selftest
      - name: 공식 화면 읽기
        run: python tools-build/kogl_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋(그 브랜치에)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected/kogl_check.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "공공누리·이용허락범위 공식 화면 확인 결과 — kogl-check 워크플로"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

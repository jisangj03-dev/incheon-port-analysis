# 히어로 영상 받기·웹용 재압축(2026-10-12) — 무거운 일·막힌 호스트는 Actions 에서(무료 연산 원칙).
# media/fetch.json 이 바뀐 커밋이 claude/ 브랜치에 오면 돈다. 결과를 그 브랜치에 커밋한다(GITHUB_TOKEN 커밋은 워크플로를 다시 부르지 않는다).
name: media-fetch

on:
  push:
    branches: ["claude/**"]
    paths: ["media/fetch.json"]   # 워크플로 자체를 고친 커밋으로는 다시 받지 않는다(세션이 다시 누른 파일을 덮지 않게)

permissions:
  contents: write

jobs:
  gate:
    # 새 브랜치 첫 push · main 병합 push 는 경로 거르개를 그냥 통과한다(main 이 그동안 바꾼 파일이 「바뀐 파일」로 잡힌다 —
    # 2026-10-12 #34 에서 media-fetch·live-check·places-fetch 가 한꺼번에 깨어나 같은 브랜치에 push 를 다퉜다).
    # 설정 파일이 main 과 실제로 다를 때만 본 작업을 돌린다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: g
        run: |
          git fetch -q origin main
          if git diff --quiet origin/main HEAD -- media/fetch.json; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "설정 파일이 main 과 같다 — 건너뜀(새 브랜치·main 병합 push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  hero:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp >/dev/null
      - name: 받기 · 원본 확인
        id: get
        run: |
          url=$(python3 -c "import json;print(json.load(open('media/fetch.json'))['hero']['url'])")
          mkdir -p /tmp/m && cd /tmp/m
          if ! curl -fsSL --retry 3 "$url" -o hero-src.mp4; then
            echo "::error::히어로 영상 링크가 막혔다(만료 또는 거부) — PR 에 적고 채팅에 다시 받아 달라고 한다"
            echo "## 히어로 영상: 받기 실패" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration -of default=nw=1 hero-src.mp4 | tee probe.txt
          echo "sha=$(sha256sum hero-src.mp4 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: 웹용으로 다시 누르기(소리 제거 · faststart · 1080/720 · 포스터)
        run: |
          cd /tmp/m
          ffmpeg -v error -y -i hero-src.mp4 -an -vf "scale=1600:-2:flags=lanczos" -c:v libx264 -profile:v high -preset veryslow -tune film -crf 33 -pix_fmt yuv420p -movflags +faststart hero-1600.mp4
          ffmpeg -v error -y -i hero-src.mp4 -an -vf "scale=960:-2:flags=lanczos" -c:v libx264 -profile:v main -preset veryslow -tune film -crf 31 -pix_fmt yuv420p -movflags +faststart hero-960.mp4
          ffmpeg -v error -y -ss 0.2 -i hero-src.mp4 -frames:v 1 -vf "scale=1920:-2:flags=lanczos" poster.png
          cwebp -quiet -q 50 -resize 1440 0 poster.png -o hero-poster.webp
          cwebp -quiet -q 55 -resize 720 0 poster.png -o hero-poster-720.webp
          # 예산을 넘으면 한 단계 더 누른다
          s=$(stat -c %s hero-1600.mp4); if [ "$s" -gt 2662400 ]; then ffmpeg -v error -y -i hero-src.mp4 -an -vf "scale=1920:-2:flags=lanczos,fps=30" -c:v libx264 -preset slow -crf 30 -pix_fmt yuv420p -movflags +faststart hero-1600.mp4; fi
          s=$(stat -c %s hero-960.mp4); if [ "$s" -gt 972800 ]; then ffmpeg -v error -y -i hero-src.mp4 -an -vf "scale=1280:-2:flags=lanczos,fps=24" -c:v libx264 -preset slow -crf 32 -pix_fmt yuv420p -movflags +faststart hero-960.mp4; fi
          ls -la
      - name: 저장소에 넣기
        run: |
          mkdir -p astro/public/media
          cp /tmp/m/hero-1600.mp4 /tmp/m/hero-960.mp4 /tmp/m/hero-poster.webp /tmp/m/hero-poster-720.webp astro/public/media/
          {
            echo "# 히어로 영상 — 출처·처리 기록(자동 생성 · media-fetch.yml)"
            echo
            echo "- 무엇: $(python3 -c "import json;print(json.load(open('media/fetch.json'))['hero']['what'])")"
            echo "- 원본 SHA-256: ${{ steps.get.outputs.sha }}"
            echo "- 원본 정보: $(tr '\n' ' ' < /tmp/m/probe.txt)"
            echo "- 처리: 소리 제거 · H.264 · faststart · 1080p/720p · 포스터 WebP(0.2초 프레임) · $(date -u +%F)"
            echo "- 표기: 화면 안 「AI 생성 장면」(개편 기준 19)"
            echo
            echo '| 파일 | 바이트 |'
            echo '|---|---:|'
            for f in hero-1600.mp4 hero-960.mp4 hero-poster.webp hero-poster-720.webp; do echo "| $f | $(stat -c %s astro/public/media/$f) |"; done
          } > astro/public/media/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro/public/media
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "히어로 영상 웹판(1080/720·포스터) — media-fetch 워크플로가 받아 다시 누름"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push
          cat astro/public/media/README.md >> "$GITHUB_STEP_SUMMARY"

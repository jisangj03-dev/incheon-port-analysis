# 인천 앞바다 등심선(디자인 「해도」 바탕) — ERDDAP 격자 수심 → 라이선스 확인 → 등심선 GeoJSON. 이 클라우드 세션은 NOAA·GEBCO 가 막혀 Actions 에서 돈다.
# 경계: 라이선스 문구가 tools-build/bathy.json accept 에 맞을 때만 등심선을 만든다(안 맞으면 meta 만 · 지도는 해안선만).
# 결과는 data/derived/bathy_incheon.{geojson,json} 으로 그 브랜치에 커밋한다(claude/ 브랜치만 · main 직접 커밋 없음).
name: bathy

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/bathy.json", "tools-build/bathy.py", "tools-build/roads.py"]

permissions:
  contents: write

jobs:
  gate:
    # 사고 131 — 경로 거르개는 「이 push 가 들여온 커밋」을 보므로 main 병합 push·새 브랜치 첫 push 에도 깨어난다.
    # push 로 깨어났으면 이 브랜치의 스크립트가 main 과 실제로 다를 때만 돈다(워크플로 파일 자체는 안 센다). 예약·수동 실행은 늘 돈다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- 'tools-build/bathy.json' 'tools-build/bathy.py' 'tools-build/roads.py'; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "스크립트가 main 과 같다 — 건너뜀(사고 131)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  bathy:
    needs: gate
    if: needs.gate.outputs.run == 'yes' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -q numpy matplotlib pmtiles mapbox-vector-tile
      - name: 홈 실루엣용 작은 타일(신항~서울~평택·이천 · z10 이하 · /tmp · 배포 안 함 — 공개 타일 파일은 그대로)
        run: |
          ver=$(python3 -c "import json;print(json.load(open('tools-build/pmtiles.json'))['go_pmtiles'])")
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${ver}/go-pmtiles_${ver}_Linux_x86_64.tar.gz" | tar -xz -C /tmp
          build=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys;b=json.load(sys.stdin);print(sorted(x['key'] for x in b)[-1])")
          /tmp/pmtiles extract "https://build.protomaps.com/${build}" /tmp/home.pmtiles --bbox=126.30,36.85,127.65,37.90 --maxzoom=10 \
            || echo "::warning::홈 실루엣 타일 추출 실패"
      - name: 육지 실루엣(땅 면 · 고속도로 — OpenStreetMap · ODbL)
        env:
          HOME_TILES: /tmp/home.pmtiles
        run: |
          python tools-build/roads.py --selftest
          python tools-build/roads.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python tools-build/bathy.py --selftest
      - name: 받기 · 라이선스 확인 · 등심선
        run: |
          python tools-build/bathy.py | tee /tmp/bathy.log
          { echo "## 등심선"; echo '```'; head -c 4000 /tmp/bathy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋(그 브랜치에)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/bathy_incheon.json data/derived/bathy_incheon.geojson data/derived/land_incheon.geojson 2>/dev/null || true
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "인천 앞바다 등심선 · 육지 실루엣 — bathy 워크플로(출처·라이선스 원문은 bathy_incheon.json · 땅·길은 OSM ODbL)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

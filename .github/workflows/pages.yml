# 측심 배포 — main 에 머지되면 Astro 를 빌드해 GitHub Pages 에 올린다(개편 기준 1 「머지만으로 공개」 · 2026-10-12).
#
# 공개는 선장님 결재다. 그래서 이 워크플로는 **Pages 소스가 「GitHub Actions」일 때만 배포한다.**
#   · 지금(소스 = Deploy from a branch): 빌드만 하고 배포는 건너뛴다 — 공개 사이트는 Jekyll 그대로.
#   · 선장님이 Settings → Pages → Source 를 「GitHub Actions」로 바꾸면(1회) 그 뒤 머지마다 자동 공개.
#   · 되돌리기: 소스를 다시 「Deploy from a branch(main · /)」로 — Jekyll 빌드가 다시 공개된다(파일을 지우지 않았다).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pages 소스 확인(배포 여부)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "unknown")
          echo "mode=$t" >> "$GITHUB_OUTPUT"
          echo "Pages build_type = $t" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 지도 타일 캐시
        uses: actions/cache@v4
        with:
          path: astro/public/tiles
          key: pmtiles-incheon-${{ hashFiles('tools-build/pmtiles.json') }}-${{ github.run_id }}
          restore-keys: pmtiles-incheon-${{ hashFiles('tools-build/pmtiles.json') }}-
      - name: 지도 타일 추출(없을 때만)
        run: bash tools-build/pmtiles.sh || echo "::warning::지도 타일 추출 실패 — 지도는 정지 이미지로 남는다"
      - name: Astro 빌드(공개판 — 시험 지면 없음) · Pagefind
        run: npm run site:build
      - name: 보고서 공유 카드(B6) — 못 찍으면 배포하지 않는다
        run: |
          npx playwright install --with-deps chromium
          npm run site:og
      - uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

# 3D 지도 자리표 후보(A-6) — Overpass API(OSM · ODbL · 키 없음)에서 이름으로 찾아 data/derived/places_osm.json 에 커밋한다.
# 이 클라우드 세션은 바깥 지도 서비스가 막혀 있어 Actions 에서 돈다(무료 연산 원칙). places.json 은 사람이 고른다.
name: places-fetch

on:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/places-query.json"]

permissions:
  contents: write

jobs:
  gate:
    # 새 브랜치 첫 push · main 병합 push 는 경로 거르개를 그냥 통과한다(main 이 그동안 바꾼 파일이 「바뀐 파일」로 잡힌다 —
    # 2026-10-12 #34 에서 media-fetch·live-check·places-fetch 가 한꺼번에 깨어나 같은 브랜치에 push 를 다퉜다).
    # 설정 파일이 main 과 실제로 다를 때만 본 작업을 돌린다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: g
        run: |
          git fetch -q origin main
          if git diff --quiet origin/main HEAD -- tools-build/places-query.json; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "설정 파일이 main 과 같다 — 건너뜀(새 브랜치·main 병합 push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Overpass 질의
        run: python tools-build/places-fetch.py
      - name: 후보 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/places_osm.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "3D 지도 자리표 후보(OSM · ODbL) — places-fetch 워크플로가 Overpass 에서 찾음"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push
          python -c "import json;d=json.load(open('data/derived/places_osm.json',encoding='utf-8'));print('\n'.join(f\"- {p['id']}: {len(p.get('candidates',[]))}\" for p in d['places']))" >> "$GITHUB_STEP_SUMMARY"

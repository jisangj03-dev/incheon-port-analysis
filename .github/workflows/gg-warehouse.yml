# 경기 시·군별 물류창고 개소(2026-10-20 · 품질기준 Q2·Q3) — 공공데이터포털 파일데이터는 세션 컨테이너에서 닿지 않아 Actions 에서 받는다. 키 0.
name: gg-warehouse
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/gg_warehouse.py", ".github/workflows/gg-warehouse.yml"]
permissions:
  contents: write
concurrency:
  group: gg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gg:
    if: startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools-build/gg_warehouse.py --selftest
      - name: 받기·세기(개수만)
        run: python tools-build/gg_warehouse.py 2>&1 | tee /tmp/log.txt; { echo "## 경기 창고"; echo '```'; tail -30 /tmp/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋(그 브랜치에)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/derived/gg_warehouse.json data/collected/gg_warehouse_diag.json; do if [ -f "$f" ]; then git add "$f"; fi; done  # 없는 경로를 같이 주면 git add 가 통째로 실패한다(첫 실행 10/20)
          git diff --cached --quiet && exit 0
          git commit -m "경기 시·군별 물류창고 개소 — gg-warehouse 워크플로(공공데이터포털 15083282 · 개수만)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

# 공개 사이트 실물 점검(A-7) — 이 클라우드 세션은 실물 호스트가 막혀 있어 Actions 에서 잰다. 결과를 그 브랜치에 문서로 커밋한다.
name: live-check

on:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/live-check.json"]

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 크롬(Lighthouse 용)
        run: npx playwright install --with-deps chromium
      - name: 실물 점검
        run: |
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          node tests/live/live-check.mjs > docs/실물점검.md
          cat docs/실물점검.md >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/실물점검.md
          git diff --cached --quiet && exit 0
          git commit -m "실물 점검 결과 — live-check 워크플로"
          git push

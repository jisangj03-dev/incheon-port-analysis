# 공개 사이트 실물 점검(A-7) — 이 클라우드 세션은 실물 호스트가 막혀 있어 Actions 에서 잰다. 결과를 그 브랜치에 문서로 커밋한다.
name: live-check

# [2026-10-22 갱신 무인화 ⑤] 주 1회 예약 실행(월 05:47 KST) — main 에서 실물을 재고 커밋하지 않는다. 어긋남(지면 응답 · 외부 요청 · 링크 깨짐 · Lighthouse 문턱)이
#   있으면 자동경보 이슈(jota 비서실 브리핑이 읽는다) · 다음 회차가 깨끗하면 스스로 닫는다.
on:
  schedule:
    - cron: "47 20 * * 0"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/live-check.json"]

permissions:
  contents: write
  issues: write

jobs:
  gate:
    # 새 브랜치 첫 push · main 병합 push 는 경로 거르개를 그냥 통과한다(main 이 그동안 바꾼 파일이 「바뀐 파일」로 잡힌다 —
    # 2026-10-12 #34 에서 media-fetch·live-check·places-fetch 가 한꺼번에 깨어나 같은 브랜치에 push 를 다퉜다).
    # 설정 파일이 main 과 실제로 다를 때만 본 작업을 돌린다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin main
          if git diff --quiet origin/main HEAD -- tools-build/live-check.json; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "설정 파일이 main 과 같다 — 건너뜀(새 브랜치·main 병합 push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  live:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 크롬(Lighthouse 용)
        run: npx playwright install --with-deps chromium
      - name: 실물 점검
        run: |
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          node tests/live/live-check.mjs > docs/실물점검.md
          cat docs/실물점검.md >> "$GITHUB_STEP_SUMMARY"
      - name: 정기 점검 경보(어긋남이 있을 때만 · 풀리면 닫는다 · main 만)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="측심 정기 점검 — 어긋남"
          gh label create 자동경보 --color B60205 --description "측심 자동 갱신 — 사람 손 필요(jota 비서실 브리핑이 읽는다)" 2>/dev/null || true
          n=$(gh issue list --state open --label 자동경보 --json number,title --jq "map(select(.title == \"$T\")) | .[0].number" || true)
          if [ -s live-check-fail.txt ]; then
            B=$(printf '주 1회 실물 점검에서 어긋난 것(실행 %s):\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(sed 's/^/- /' live-check-fail.txt)")
            if [ -n "$n" ]; then gh issue comment "$n" --body "$B"; else gh issue create --title "$T" --body "$B" --label 자동경보; fi
          elif [ -n "$n" ]; then gh issue close "$n" --comment "$(printf '이번 점검은 깨끗하다(실행 %s) — 스스로 닫는다.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"; fi
      - name: 결과 커밋(브랜치 실행만 — main 예약 실행은 커밋하지 않는다)
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/실물점검.md
          git diff --cached --quiet && exit 0
          git commit -m "실물 점검 결과 — live-check 워크플로"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

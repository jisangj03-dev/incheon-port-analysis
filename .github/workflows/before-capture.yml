# 개편 전 캡처 8장 — **한 번 쓰고 지우는 워크플로**(2026-10-10).
# 클라우드 세션은 네트워크 정책이 github.io·higgsfield.app 을 막아 공개 화면을 못 찍는다.
# 그래서 이 파일이 든 커밋이 이 브랜치에 push 될 때 러너가 찍어서 docs/개편전_20261010/ 에 커밋한다.
# 다음 커밋에서 이 파일을 지운다 — main 에는 남지 않는다.
# v2: 첫 판은 리빌 블록이 빈 채로 찍혔다 — capture.mjs 가 끝까지 스크롤한 뒤 찍는다. git pull 로 앞 커밋을 덮는다.
name: before-capture

on:
  push:
    branches: [claude/eager-edison-mistkg]
    paths: [.github/workflows/before-capture.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: 공개 화면 4 × 크기 2 캡처
        run: node tests/capture/capture.mjs "docs/개편전_20261010"
      - uses: actions/upload-artifact@v4
        with:
          name: before-capture
          path: docs/개편전_20261010/
      - name: 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "docs/개편전_20261010"
          git commit -m "개편 전 캡처 8장 (공개 화면 · Actions 러너가 찍음)"
          git push

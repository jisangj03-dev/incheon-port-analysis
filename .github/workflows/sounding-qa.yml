# 측심 검사 — PR 마다 Astro 빌드·계산기 회귀·개편 기준 자동 판정·Lighthouse 를 돈다(2026-10-10 · 2026-10-12 Astro 이전).
# 결과는 artifact 로만 남긴다. 외부 업로드 없음(Lighthouse 는 CLI 직접 실행 · 파일 출력만).
# 배포는 하지 않는다 — 배포는 .github/workflows/pages.yml(main 푸시 · Pages 소스가 「GitHub Actions」일 때만).
name: sounding-qa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounding-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"   # Astro 기본 텔레메트리(외부 전송)를 끈다
  NEXT_TELEMETRY_DISABLED: "1"
  COST_ADAPTER: v2                # 계산기 v2 화면(기준 6 · 기대값 파일은 그대로)

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 「마지막 갱신일」(기준 14)은 파일의 마지막 커밋 날짜다

      # 되돌림 길 — Pages 소스를 「Deploy from a branch」로 되돌리면 이 Jekyll 빌드가 다시 공개된다. 그 길이 안 깨졌는지만 본다.
      - name: Jekyll 빌드 (되돌림 길 확인 · Pages 기존 빌더)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site/incheon-port-analysis
      - name: 빌드 산출물 소유권(도커가 root 로 쓴다)
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit (고정 버전 취약점 0 확인)
        run: npm audit --audit-level=low

      - name: 지도 타일 캐시(월 1회 추출 · 판정 v2 주의 ③)
        uses: actions/cache@v4
        with:
          path: astro/public/tiles
          key: pmtiles-incheon-${{ hashFiles('tools-build/pmtiles.json') }}-${{ github.run_id }}
          restore-keys: pmtiles-incheon-${{ hashFiles('tools-build/pmtiles.json') }}-
      - name: 지도 타일 추출(없을 때만 · go-pmtiles)
        run: bash tools-build/pmtiles.sh || echo "::warning::지도 타일 추출 실패 — 지도는 정지 이미지로 남는다"

      - name: Astro 빌드(시험 지면 포함) · Pagefind 색인 · 타입 검사
        run: |
          SOUNDING_LAB=1 npm run site:build
          npm run astro:check

      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium
      - name: 보고서 공유 카드(B6 · 1200×630 · 틀 HTML 은 지운다)
        run: npm run site:og
      - name: Playwright 시험 (계산기 회귀 · 개편 기준 · 도구 실행 증명 · Pagefind)
        run: npx playwright test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: webapp-testing 스킬 경로 (with_server.py + 파이썬 Playwright)
        run: |
          python -m pip install -q -r requirements-dev.txt
          python .claude/skills/webapp-testing/scripts/with_server.py \
            --server "node tests/serve.mjs 4173 astro/dist" --port 4173 \
            -- python tests/py/calc_smoke.py
      - name: 계산기 계산식 검사(엑셀 가상 샘플 · 금액 상수 0)
        run: python analysis/check_cost_tool.py
      - name: 예측 원장 덧붙이기만(정체성 전환 §3-4 F1) · 예측 계산 시험
        run: |
          git fetch -q origin main
          python tools-build/check_ledger.py
          python analysis/forecast_teu.py --selftest

      - name: Lighthouse 13.5.0 (홈·계산기·배치도 · 모바일)
        run: |
          python .claude/skills/webapp-testing/scripts/with_server.py \
            --server "node tests/serve.mjs 4175 astro/dist" --port 4175 \
            -- bash -c 'curl -sf -o /dev/null http://127.0.0.1:4175/incheon-port-analysis/ && node tests/lighthouse/run.mjs http://127.0.0.1:4175'
          cat lighthouse-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 세션 시작 컨텍스트 근사치(기준 25)
        run: npm run budget >> "$GITHUB_STEP_SUMMARY"

      - name: Remotion 실행 증명(정지 프레임 하나 · 무료 연산)
        run: |
          npx remotion browser ensure || true
          npm run remotion:still
      - name: 결과 보관 (artifact 만)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounding-qa-${{ github.run_number }}
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            lighthouse-results/
            lab-out/
          if-no-files-found: warn

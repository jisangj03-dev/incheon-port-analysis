# 해양수산부 국가별 컨테이너 탐색(2026-10-20 · 품질기준 Q3) — 인천항을 나라별로 가른 실측이 있는가. 명세·응답 머리만 그 브랜치에 남긴다. 키 = DATA_GO_KR_KEY(로그에 안 찍는다).
name: mof-probe
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools-build/v3/mof_nation_probe.py", ".github/workflows/mof-probe.yml"]
permissions:
  contents: write
concurrency:
  group: mof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    # 사고 131 — 경로 거르개는 「이 push 가 들여온 커밋」을 보므로 main 병합 push·새 브랜치 첫 push 에도 깨어난다.
    # push 로 깨어났으면 이 브랜치의 스크립트가 main 과 실제로 다를 때만 돈다(워크플로 파일 자체는 안 센다). 예약·수동 실행은 늘 돈다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- 'tools-build/v3/mof_nation_probe.py'; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "스크립트가 main 과 같다 — 건너뜀(사고 131)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  probe:
    needs: gate
    if: needs.gate.outputs.run == 'yes' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 탐색
        working-directory: tools-build/v3
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python mof_nation_probe.py
      - name: 결과 커밋(그 브랜치에)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/collected/v3/mof_nation_probe.json ] && git add data/collected/v3/mof_nation_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "해양수산부 국가별 컨테이너 탐색 — mof-probe 워크플로"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

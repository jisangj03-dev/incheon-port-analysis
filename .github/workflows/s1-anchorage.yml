# 위성 묘박지 SAR(P1 ④ · 2026-10-15) — Sentinel-1 RTC(Planetary Computer · 익명 서명 · 키 0)로 묘박지 배 세기. 세션은 바깥 위성 자료에 못 닿아 Actions 에서 돈다.
name: s1-anchorage
on:
  workflow_dispatch:
    inputs:
      diag:
        description: "기준값 진단(1) — 결과 파일 대신 data/collected/s1_diag.json"
        required: false
        default: "0"
  push:
    branches: ["claude/**"]
    paths: ["tools-build/s1_anchorage.py", ".github/workflows/s1-anchorage.yml"]
permissions:
  contents: write
concurrency:
  group: s1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    # 사고 131 — 경로 거르개는 「이 push 가 들여온 커밋」을 보므로 main 병합 push·새 브랜치 첫 push 에도 깨어난다.
    # push 로 깨어났으면 이 브랜치의 스크립트가 main 과 실제로 다를 때만 돈다(워크플로 파일 자체는 안 센다). 예약·수동 실행은 늘 돈다.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- 'tools-build/s1_anchorage.py'; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "스크립트가 main 과 같다 — 건너뜀(사고 131)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
  s1:
    needs: gate
    if: needs.gate.outputs.run == 'yes' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q numpy==2.5.3 scipy==1.18.1 rasterio==1.5.1 pystac-client==0.8.5 planetary-computer==1.0.0
      - run: python tools-build/s1_anchorage.py --selftest
      - name: 장면 받기·배 세기(12달)
        timeout-minutes: 30
        env:
          S1_DIAG: ${{ inputs.diag || '0' }}
        run: python tools-build/s1_anchorage.py --months 12 2>&1 | tee /tmp/log.txt; { echo "## S1"; echo '```'; tail -40 /tmp/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 땅·해안 반사 빼기(2026-10-20 · docs/품질기준.md Q2 — 섬·방파제 위 「배」 21.5%)
        if: inputs.diag != '1'
        run: python tools-build/anchorage_landmask.py --selftest && python tools-build/anchorage_landmask.py
      - name: 결과 커밋(그 브랜치에)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/s1_anchorage.json data/collected/s1_diag.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "위성 묘박지 SAR — s1-anchorage 워크플로(Sentinel-1 RTC · 배 자리·척수)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push

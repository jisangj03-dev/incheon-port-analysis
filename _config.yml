# GitHub Pages 사이트 메타.
#
# 왜 생겼나 [2026-08-27 실물 확인]. 이 파일이 없으면 GitHub이 **저장소 이름**을 사이트 제목으로 쓴다.
#   발행 페이지의 헤더가 실제로 <h1><a>incheon-port-analysis</a></h1> 였다.
#   허브가 「Vidimus」로 발행되면 스포크 머리에 저장소 슬러그가 걸려 브랜드가 갈린다.
#
# theme를 명시하는 이유. 지금 렌더가 GitHub Pages 기본 테마이고, 그것을 **추정하지 않고 실측했다** —
#   본문 래퍼 클래스 "container-lg px-3 my-5 markdown-body" + /assets/css/style.css + Jekyll v3.10.0.
#   이는 jekyll-theme-primer의 지문이다. 명시하지 않고 _config.yml만 추가하면 테마가 바뀔 여지가 남고,
#   **발행본 7편의 표현이 거기 걸려 있다.**
#
# 안 건드리는 것: 저장소 이름과 Pages URL. 지침 §6 정지선 — rename 시 project site URL은
#   리디렉트되지 않는다. 이 파일은 **표시 제목만** 바꾸고 URL에는 닿지 않는다.
#
# 여기 편수를 적지 않는다. 낡는다(사고 31). 편수는 README가 든다.
#
# [2026-08-27 정정 — 사고 44] description이 「인천항 물류·무역 …」이었다.
#   「무역」은 **#08(관세청)이 이 저장소에 있기 때문에** 들어간 말이고,
#   #08의 배치는 **미결(추인 A)**이다. 즉 이 파일의 내용이 다른 미결 문항의 답에 종속이었다.
#   산업 열거를 빼서 **종속을 문서화하는 대신 없앴다.** 이제 A가 어느 쪽으로 정해져도 이 줄은 안 바뀐다.
#   (같은 이유로 지침 §6.1이 첫 화면에서 산업명을 뺀다. 여기는 첫 화면이 아니지만 낡는 구조가 같다.)
#
# 이 파일 자체는 A에 독립이다 — §6이 「기존 7편은 그 자리에 남는다」로 인천 Pages를 존치시키므로,
#   #08이 어디로 가든 이 저장소에는 Pages 사이트가 남고 그 표시 설정이 필요하다.
#
# [2026-08-27 정정 — 사고 44 추가 관측] 위 근거는 A로부터의 독립까지만 말한다.
#   **C(「영구 동결」의 뜻)로부터는 독립이 아니다** — 인용한 「기존 7편은…」이 하필
#   「영구 동결」과 **같은 문장**에 있다. C가 「표시 동결」로 정해지면 **이 파일의 신설 자체가
#   표시 변경이라 걸린다.** 되돌리기 비용은 0에 가깝다 — 파일 하나이고 아직 push되지 않았다.
#   판정은 운영자 몫이다(§0-4). 표 = docs\STATUS.md 「인천 저장소 배치」 절.

title: "Vidimus · 비디무스"
description: "말해진 것을 1차 데이터로 확인한다 — 인천항 데이터 리서치"
theme: jekyll-theme-primer

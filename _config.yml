# GitHub Pages 사이트 메타.
#
# 왜 생겼나 [2026-08-27 실물 확인]. 이 파일이 없으면 GitHub이 **저장소 이름**을 사이트 제목으로 쓴다.
#   발행 페이지의 헤더가 실제로 <h1><a>incheon-port-analysis</a></h1> 였다.
#
# theme를 명시하는 이유. 지금 렌더가 GitHub Pages 기본 테마이고, 그것을 **추정하지 않고 실측했다** —
#   래퍼 클래스 "container-lg px-3 my-5 markdown-body" + /assets/css/style.css + Jekyll v3.10.0.
#   jekyll-theme-primer의 지문이다. 명시하지 않으면 테마가 바뀔 여지가 남고,
#   **발행본의 표현이 거기 걸려 있다.** 기준선 = docs/렌더_기준선.md.
#
# [2026-09-06] 자체 레이아웃을 얹었다 — `_layouts/default.html` · `_includes/` · `assets/css/vidimus.css`.
#   theme 는 그대로 둔다(플러그인 묶음이 거기 걸려 있다). 저장소의 `_layouts/` 가 테마의 것보다
#   먼저 잡히므로 래퍼가 바뀐다 — 그것이 **의도**이고 새 기준선은 docs/렌더_기준선.md 가 든다.
#   front matter 가 없는 발행본에도 레이아웃이 입혀진다(jekyll-default-layout · 실측 근거 같은 문서).
#
# 안 건드리는 것: 저장소 이름과 Pages URL. 지침 §6 정지선 — rename 시 project site URL은
#   리디렉트되지 않는다. 이 파일은 **표시 제목만** 바꾸고 URL에는 닿지 않는다.
#   url · baseurl 은 GitHub Pages 가 프로젝트 사이트에 스스로 넣는 값과 **같은 값**을 명시한 것이다 —
#   `absolute_url`(링크 카드 · canonical)이 빌드 환경에 기대지 않게.
#
# 편수를 적지 않는다. 낡는다(사고 31). 편수는 README가 든다.
#
# [2026-08-28 v6.0] description이 인천항을 직접 든다.
#   종전에는 산업 열거를 뺐다 — 「무역」이 #08 배치라는 미결 문항에 종속이었기 때문이다(사고 44).
#   그 미결은 추인 C·D로 닫혔고, 운영자 선언으로 **축이 인천항 하나가 됐다**(지침 v6.0 §1.3).
#   이제 대상을 적는 것이 종속이 아니라 확정 사실이다.


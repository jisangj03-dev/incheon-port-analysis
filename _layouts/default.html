<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>{%- include head.html -%}</head>
<body{% if page.url == '/' %} class="home"{% endif %}>
  <!-- 이 레이아웃이 왜 있나 [2026-09-06]. 발행본 아홉 편이 GitHub Pages 기본 테마(primer)로
       나가고 있었다 — 헤더가 저장소 이름, 본문은 GitHub README 결. 측심(sounding.higgsfield.app)에서
       보고서를 누르면 마감이 그 자리에서 떨어진다(실물 스크린샷). 발행본 마크다운은 한 글자도
       건드리지 않는다(지침 §10-8) — 그릇만 바꾼다. 스타일 = assets/css/vidimus.css.
       front matter 가 없는 발행본에도 이 레이아웃이 입혀진다(GitHub Pages 기본 플러그인
       jekyll-default-layout · 실측 근거 = docs/렌더_기준선.md). -->
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  {%- include masthead.html -%}
  <main id="main" tabindex="-1" data-root="{{ '/' | relative_url }}">
    <article class="doc">
      {{ content }}
    </article>
    <!-- 차례. 스크립트가 본문의 h2 로 채운다(절이 셋 이상일 때만) · 넓은 화면(≥1280px)에서만 보인다. -->
    <aside class="toc" aria-label="이 지면의 차례" hidden></aside>
  </main>
  {%- include footer.html -%}
  <!-- 옆으로 흐르는 표·코드 블록은 키보드로도 흘러야 한다 — axe `scrollable-region-focusable`
       (2026-09-06 모바일 실측 · 발행본 표가 열보다 넓을 때 · 2026-09-07 README 의 저장소 트리 `pre` 도 같은 결함).
       실제로 흐르는 것에만 tabindex 를 준다. JS 가 없으면 그대로 보이고 마우스·손가락으로는 여전히 흐른다. -->
  <script>
    (function () {
      var t = document.querySelectorAll(".doc table, .doc pre");
      function mark(el) {
        var scrolls = el.scrollWidth > el.clientWidth + 1;
        if (scrolls) el.setAttribute("tabindex", "0"); else el.removeAttribute("tabindex");
        el.classList.toggle("is-scroll", scrolls);
        el.classList.toggle("at-end", !scrolls || el.scrollLeft + el.clientWidth >= el.scrollWidth - 2);
      }
      for (var i = 0; i < t.length; i++) {
        mark(t[i]);
        t[i].addEventListener("scroll", (function (el) { return function () { mark(el); }; })(t[i]), { passive: true });
      }
      // 창이 돌아가면(휴대폰 가로·세로) 흐름 여부가 바뀐다.
      window.addEventListener("resize", function () { for (var i = 0; i < t.length; i++) mark(t[i]); });
    })();
  </script>
  <!-- 숫자 열은 오른쪽 정렬. 발행본 표의 정렬은 마크다운 기본(왼쪽)이라 자릿수가 안 맞는다.
       열의 몸통 칸 6할 이상이 수(쉼표·소수점·%·±·배·TEU·p 허용)이면 그 열 전체(머리 포함)에 .num 을 준다. -->
  <script>
    (function () {
      var NUM = /^[+\-−–]?\s*[\d,]+(\.\d+)?\s*(%|%p|배|TEU|천TEU|p|건|개월|개)?\s*$/;
      var tables = document.querySelectorAll(".doc table");
      for (var t = 0; t < tables.length; t++) {
        var rows = tables[t].querySelectorAll("tbody tr");
        if (!rows.length) continue;
        var ncol = rows[0].children.length;
        for (var c = 0; c < ncol; c++) {
          var n = 0, tot = 0;
          for (var r = 0; r < rows.length; r++) {
            var cell = rows[r].children[c];
            if (!cell) continue;
            var s = cell.textContent.replace(/\s+/g, " ").trim();
            if (!s || s === "—" || s === "-") continue;
            tot++;
            if (NUM.test(s)) n++;
          }
          if (tot && n / tot >= 0.6) {
            var all = tables[t].querySelectorAll("tr");
            for (var k = 0; k < all.length; k++) {
              var cc = all[k].children[c];
              if (cc) cc.classList.add("num");
            }
          }
        }
      }
    })();
  </script>
  <!-- 보고서 지면의 길 — 차례(오른쪽 · 현재 절 강조) · 이전/다음 편 · 상단 바의 「보고서」 현재 표시.
       이전/다음 편은 목록을 여기 들지 않고 **첫 화면을 읽어서** 만든다 — 손으로 든 목록은 편이 늘 때마다 낡는다(사고 31).
       실물은 kramdown 이 h2 에 id 를 주고, 미리보기는 안 주므로 없으면 스크립트가 만든다. -->
  <script>
    (function () {
      var isReport = /\/reports\/report_\d+/.test(location.pathname);
      var main = document.getElementById("main");
      var root = (main && main.getAttribute("data-root")) || "/";
      var doc = document.querySelector(".doc");
      if (!doc) return;

      if (isReport) {
        // 선택자를 문자열 결합으로 만들지 않는다 — `href="` 리터럴이 있으면 링크 검사기가 링크로 읽는다(실측).
        var links0 = document.querySelectorAll(".mast__nav a"), cur = null;
        for (var j = 0; j < links0.length; j++) if (links0[j].getAttribute("href") === root) cur = links0[j];
        if (cur) cur.setAttribute("aria-current", "page");
      }

      // 차례
      var toc = document.querySelector(".toc");
      var h2s = Array.prototype.slice.call(doc.querySelectorAll("h2"));
      if (toc && isReport && h2s.length >= 3) {
        var used = {};
        h2s.forEach(function (h, i) {
          if (!h.id) {
            var id = h.textContent.trim().toLowerCase().replace(/[^\w\uac00-\ud7a3]+/g, "-").replace(/^-+|-+$/g, "") || "s" + i;
            while (used[id] || document.getElementById(id)) id += "-1";
            h.id = id;
          }
          used[h.id] = true;
        });
        var ol = document.createElement("ol");
        h2s.forEach(function (h) {
          var li = document.createElement("li"), a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent.trim();
          li.appendChild(a);
          ol.appendChild(li);
        });
        var cap = document.createElement("p");
        cap.className = "toc__cap";
        cap.textContent = "차례";
        toc.appendChild(cap);
        toc.appendChild(ol);
        toc.hidden = false;
        var links = ol.querySelectorAll("a");
        var setCur = function (id) {
          for (var i = 0; i < links.length; i++) {
            var on = links[i].getAttribute("href") === "#" + id;
            links[i].classList.toggle("is-cur", on);
            if (on) links[i].setAttribute("aria-current", "true"); else links[i].removeAttribute("aria-current");
          }
        };
        var pick = function () {
          var best = null;
          h2s.forEach(function (h) { if (h.getBoundingClientRect().top <= 120) best = h; });
          setCur(best ? best.id : "");
        };
        window.addEventListener("scroll", pick, { passive: true });
        pick();
      }

      // 이전 · 다음 편 — 첫 화면의 목록을 읽는다
      if (isReport && window.fetch) {
        fetch(root, { credentials: "same-origin" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (html) {
          if (!html) return;
          var d = new DOMParser().parseFromString(html, "text/html");
          var as = Array.prototype.slice.call(d.querySelectorAll('a[href*="reports/report_"]'));
          if (as.length < 2) return;
          var me = (location.pathname.match(/report_(\d+)_/) || [])[1];
          var idx = -1;
          var items = as.map(function (a, i) {
            var n = (a.getAttribute("href").match(/report_(\d+)_/) || [])[1];
            if (n === me) idx = i;
            var num = a.querySelector("strong");
            return { href: a.getAttribute("href"), num: num ? num.textContent.trim() : "#" + n,
                     title: a.textContent.replace(num ? num.textContent : "", "").trim() };
          });
          if (idx < 0) return;
          var abs = function (href) { return /^(https?:)?\//.test(href) ? href : root + href; };
          var nav = document.createElement("nav");
          nav.className = "pager";
          nav.setAttribute("aria-label", "이전 · 다음 편");
          var mk = function (it, kind, label) {
            var a = document.createElement("a");
            a.className = "pager__" + kind;
            a.href = abs(it.href);
            var l = document.createElement("span"); l.className = "pager__label"; l.textContent = label;
            var t = document.createElement("span"); t.className = "pager__title";
            var s = document.createElement("strong"); s.textContent = it.num;
            t.appendChild(s); t.appendChild(document.createTextNode(" " + it.title));
            a.appendChild(l); a.appendChild(t);
            return a;
          };
          if (idx > 0) nav.appendChild(mk(items[idx - 1], "prev", "이전 편"));
          if (idx < items.length - 1) nav.appendChild(mk(items[idx + 1], "next", "다음 편"));
          if (nav.childNodes.length) doc.appendChild(nav);
        }).catch(function () {});
      }
    })();
  </script>
  <!-- 리빌. 보고서 행·그림·표·인용이 스크롤에 맞춰 떠오른다(애플 지면의 문법).
       JS 가 없거나 IntersectionObserver 가 없거나 감속 모션이면 그냥 보인다 — CSS 가 html.js 에만 건다. -->
  <script>
    (function () {
      if (!("IntersectionObserver" in window)) return;
      var sel = ".doc img, .doc table, .doc blockquote";
      var rows = [];
      try { rows = document.querySelectorAll(".home .doc li:has(> a[href*='reports/report_'])"); } catch (e) {}
      var els = Array.prototype.slice.call(document.querySelectorAll(sel)).concat(Array.prototype.slice.call(rows));
      if (!els.length) return;
      document.documentElement.classList.add("js");
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("is-in"); io.unobserve(en.target); }
        });
      }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
      Array.prototype.forEach.call(rows, function (r, i) { r.style.transitionDelay = Math.min(i * 45, 360) + "ms"; });
      els.forEach(function (el) { el.classList.add("rv"); io.observe(el); });
    })();
  </script>
</body>
</html>
